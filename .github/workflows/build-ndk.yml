name: NDK build

on:
  workflow_dispatch:
  push:
    branches-ignore: ['version-*']
  pull_request:
    branches-ignore: ['version-*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2
      - name: Build package
        run: qpm2 qpkg
      - name: Verify packaged library
        run: |
          python3 -c "from pathlib import Path; from zipfile import ZipFile; assert ZipFile('scotland2.qpkg').read('bin/libsl2.so') == Path('build/libsl2.so').read_bytes()"
      - uses: actions/upload-artifact@v4
        with:
          name: scotland2
          path: |
            build/libsl2.so
            build/debug_libsl2.so
            scotland2.qpkg
          if-no-files-found: error
